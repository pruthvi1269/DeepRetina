<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | DeepRetina Patient Registration Portal</title>
    <link rel="icon" href="/static/images/logo_web.png">

<meta name="keywords"
content="DeepRetina, Diabetic Retinopathy Detection, AI Eye Disease Detection, Retina Analysis, DenseNet121, Deep Learning, Medical AI, Fundus Image Analysis, Retinal Screening, Ophthalmology AI, Eye Disease Prediction, Healthcare AI, Retina Diagnosis">


  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
              


</head>

<body>

  <!-- Background Bubbles -->
  <div class="bubbles">

  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>

</div>

  <!-- Registration Section -->
  <section class="register-section">

    <div class="container">

      <div class="row justify-content-center">

        <div class="col-lg-9 col-xl-8">

          <div class="register-card">

            <!-- Top -->
            <div class="top-area d-flex justify-content-between align-items-center">

              <h1 class="register-title">
                Patient Registration
              </h1>

              <div class="close-btn" id="closeBtn">
                ✕
              </div>

            </div>

            <!-- Form -->
            <form action="/register_patient" method="POST">

              <!-- Name -->
              <div class="input-group-area">

                <label class="form-label">
                  👤 Full Name
                </label>

                <input
                  type="text"
                  class="form-control custom-input"
                  placeholder="Enter your full name" name="full_name"
                  required
                >

              </div>

              <!-- Mobile -->
              <div class="input-group-area">

                <label class="form-label">
                  📞 Mobile Number
                </label>

                 <input
                type="tel"
               class="form-control custom-input"
               placeholder="Enter your mobile number"
               name="mobile"
               pattern="[0-9]{10}"
               required
               >

              </div>

              <!-- Email -->
              <div class="input-group-area">

                <label class="form-label">
                  ✉ Email ID
                </label>

                <input
                  type="email"
                  class="form-control custom-input"
                  placeholder="Enter your email address" name="email"
                  required
                >

              </div>

              <div class="input-group-area">

<label class="form-label">
🔒 Password
</label>

<input
  type="password"
  name="password"
  class="form-control custom-input"
  placeholder="Create password"
  minlength="6"
  required
>

</div>

              <!-- Buttons -->
              <div class="row g-4 mt-2">

                <div class="col-md-6">

                  <button type="button" class="btn cancel-btn w-100" id="cancelBtn">
                    Cancel
                  </button>

                </div>

                <div class="col-md-6">

                  <button type="submit" class="btn register-btn w-100">
                    Register & Generate ID
                  </button>

                </div>

                <div class="col-md-5 d-flex justify-content-center mx-auto mt-2">

                  <a href="/login" class="btn register-btn sign-btn">
                    Sign In
                  </a>

                </div>

              </div>

            </form>

          </div>

        </div>

      </div>

    </div>

  </section>

  <script>

const cancelBtn =
document.getElementById("cancelBtn");

const closeBtn =
document.getElementById("closeBtn");

/* Cancel Button */

cancelBtn.addEventListener("click", function(){

  window.location.href = "/";

});

/* Close Button */

closeBtn.addEventListener("click", function(){

  window.location.href = "/";

});

</script>



{% if request.args.get('error') == 'email' %}

<div class="error-popup" id="errorPopup">

  <div class="error-icon">
    ⚠
  </div>

  <div class="error-content">

    <h3>
      Registration Failed
    </h3>

    <p>
      This Email Is Already Registered
    </p>

  </div>

  <button class="close-popup" id="closePopup">
    ✕
  </button>

</div>

{% endif %}

<script>

const popup =
document.getElementById("errorPopup");

const popupCloseBtn =
document.getElementById("closePopup");

if(popupCloseBtn){

  popupCloseBtn.addEventListener("click", () => {

    popup.style.display = "none";

  });

}

setTimeout(() => {

  if(popup){

    popup.style.display = "none";

  }

}, 3000);

</script>
</body>
</html>
