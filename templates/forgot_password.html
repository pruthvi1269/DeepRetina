<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Recover Account | DeepRetina Password Reset</title>
  <link rel="icon" href="/static/images/logo_web.png">

<meta name="keywords"
content="DeepRetina, Diabetic Retinopathy Detection, AI Eye Disease Detection, Retina Analysis, DenseNet121, Deep Learning, Medical AI, Fundus Image Analysis, Retinal Screening, Ophthalmology AI, Eye Disease Prediction, Healthcare AI, Retina Diagnosis">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
>

<link
rel="stylesheet"
href="{{ url_for('static', filename='register.css') }}"
>


<style>

/* Success Popup */

.success-popup{

  position:fixed;

  top:50%;

  left:20%;

  transform:translate(-50%, -50%);

  width:520px;

  background:linear-gradient(135deg,#76f2a9,#009624);

  border-radius:20px;

  padding:22px;

  display:flex;

  align-items:left;

  gap:18px;

  z-index:9999;

  box-shadow:0 0 35px rgba(0,200,83,0.35);

  animation:popupShow 0.35s ease;

}

</style>
</head>

<body>

<div class="bubbles">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

<section class="register-section">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="register-card">

<div class="top-area d-flex justify-content-between align-items-center">

<h1 class="register-title">
Reset Password
</h1>

<div
class="close-btn"
onclick="window.location.href='/login'"
>

✕

</div>

</div>

<form
action="/reset_password"
method="POST"
>

<div class="input-group-area">

<label class="form-label">
✉ Enter Registered Email
</label>

<input
type="email"
name="email"
class="form-control custom-input"
placeholder="Enter your email"
required
>

</div>

<button
type="submit"
class="btn register-btn w-100 mt-3"
>

Send Reset Link

</button>

</form>

</div>

</div>

</div>

</div>

</section>
{% if request.args.get('success') %}

<div class="success-popup" id="successPopup">

  <div class="error-icon">
    ✓
  </div>

  <div class="error-content">

    <h3>
      Success
    </h3>

    <p>
      Reset Link Sent Successfully
    </p>

  </div>

</div>

<script>

setTimeout(() => {

  document.getElementById(
    "successPopup"
  ).style.display = "none";

}, 3000);

</script>

{% endif %}


{% if request.args.get('error') %}

<div class="error-popup" id="errorPopup">

  <div class="error-icon">
    ⚠
  </div>

  <div class="error-content">

    <h3>
      Email Not Found
    </h3>

    <p>
      Please Register First
    </p>

  </div>

</div>

<script>

setTimeout(() => {

  document.getElementById(
    "errorPopup"
  ).style.display = "none";

}, 3000);

</script>

{% endif %}
</body>
</html>
