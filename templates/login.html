<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Patient Login | DeepRetina AI Retinal Screening Platform</title>
  <link rel="icon" href="/static/images/logo_web.png">


  <meta name="keywords"
content="DeepRetina, Diabetic Retinopathy Detection, AI Eye Disease Detection, Retina Analysis, DenseNet121, Deep Learning, Medical AI, Fundus Image Analysis, Retinal Screening, Ophthalmology AI, Eye Disease Prediction, Healthcare AI, Retina Diagnosis">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="{{ url_for('static', filename='register.css') }}">

</head>

<body>

      <div class="bubbles">

  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>

</div>

<section class="register-section">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="register-card">

<div class="d-flex justify-content-between align-items-center mb-4">

  <h1 class="register-title">
    Patient Login
  </h1>

  <div class="close-btn" id="closeBtn">
    ✕
  </div>

</div>

<form action="/login_patient" method="POST">

<div class="mb-3">

<input
type="email"
name="email"
class="form-control custom-input"
placeholder="Enter email"
>

</div>

<div class="mb-4">

<input
type="password"
name="password"
class="form-control custom-input"
placeholder="Enter password"
>

</div>

<button class="btn register-btn w-100">
Sign In
</button>
<div class="text-center mt-3">

  <a
    href="/forgot_password"
    class="forgot-link"
  >

    Forgot Password?

  </a>

</div>
</form>

</div>

</div>

</div>

</div>

</section>

<script>

const closeBtn =
document.getElementById("closeBtn");

closeBtn.addEventListener("click", () => {

  window.location.href = "/";

});

</script>

{% if request.args.get('error') == 'newuser' %}

<div class="error-popup" id="newUserPopup">

  <div class="error-icon">
    ⚠
  </div>

  <div class="error-content">

    <h3>
      Account Not Found
    </h3>

    <p>
      Please Register First
    </p>

  </div>

</div>

<script>

setTimeout(() => {

  window.location.href = "/register";

}, 2500);

</script>

{% endif %}


{% if request.args.get('error') == 'invalid' %}

<div class="error-popup" id="errorPopup">

  <div class="error-icon">
    ⚠
  </div>

  <div class="error-content">

    <h3>
      Login Failed
    </h3>

    <p>
      Invalid Email Or Password
    </p>

  </div>

  <button class="close-popup" id="closePopup">
    ✕
  </button>

</div>

{% endif %}

<script>

const popup =
document.getElementById("errorPopup");

const popupCloseBtn =
document.getElementById("closePopup");

if(popupCloseBtn){

  popupCloseBtn.addEventListener("click", () => {

    popup.style.display = "none";

  });

}

setTimeout(() => {

  if(popup){

    popup.style.display = "none";

  }

}, 3000);

</script>
</body>
</html>
